version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: src/PlatformServiceTemplate.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionString: Server=sqlserver,1433;Database=dbname;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -No -C -S localhost -U sa -P \"YourStrong@Passw0rd\" -Q \"SELECT 1\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sqlserver-data:/var/opt/mssql

  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: platform_service_template
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U postgres -d platform_service_template" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  sqlserver-data:
